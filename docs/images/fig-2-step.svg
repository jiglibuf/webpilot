<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-label="webpilot: один шаг агента с пояснениями">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
    <style>
      .bg2 { fill: #020617; }
      .h1 { fill: #e2e8f0; font: 700 21px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .sub { fill: #94a3b8; font: 400 11px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .stage { fill: rgba(6, 78, 59, 0.45); stroke: #34d399; stroke-width: 1.5; }
      .stage-v { fill: rgba(8, 51, 68, 0.45); stroke: #22d3ee; stroke-width: 1.5; }
      .stage-r { fill: rgba(136, 19, 55, 0.42); stroke: #fb7185; stroke-width: 1.5; }
      .op { fill: #0f172a; }
      .panel { fill: rgba(15, 23, 42, 0.9); stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; }
      .panel-r { fill: rgba(136, 19, 55, 0.16); stroke: #fb7185; stroke-width: 1; stroke-dasharray: 4,4; }
      .n1 { fill: #f1f5f9; font: 600 13px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .n2 { fill: #94a3b8; font: 400 9px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .n3 { fill: #cbd5e1; font: 400 9.5px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .nh { fill: #e2e8f0; font: 700 9.5px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .nhr { fill: #fb7185; font: 700 9.5px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .lbl { fill: #64748b; font: 400 9px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .lblr { fill: #fb7185; font: 400 9px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .flow2 { stroke: #64748b; stroke-width: 1.4; fill: none; }
      .flow2r { stroke: #fb7185; stroke-width: 1.4; fill: none; stroke-dasharray: 5,4; }
      .lead2 { stroke: #475569; stroke-width: 1; stroke-dasharray: 3,3; fill: none; }
      .mono { fill: #a5f3fc; font: 400 10px 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>

  <rect class="bg2" width="1280" height="700"/>
  <rect width="1280" height="700" fill="url(#grid2)"/>

  <text class="h1" x="40" y="48">Один шаг агента, шаг за шагом</text>
  <text class="sub" x="40" y="70">Слева — что происходит, справа — что из этого следует. Кольцо замкнуто: результат проверки становится входом следующего шага.</text>

  <!-- 1 OBSERVE -->
  <rect class="op" x="120" y="118" width="560" height="74" rx="6"/>
  <rect class="stage-v" x="120" y="118" width="560" height="74" rx="6"/>
  <text class="n1" x="140" y="144">1 · observe — снимок страницы</text>
  <text class="n2" x="140" y="161">browser/session.py + dom_snapshot.js + browser/snapshot.py</text>
  <text class="n3" x="140" y="178">интерактивные узлы нумеруются, текст ранжируется по значимости</text>

  <!-- 2 DECIDE -->
  <rect class="op" x="120" y="222" width="560" height="74" rx="6"/>
  <rect class="stage" x="120" y="222" width="560" height="74" rx="6"/>
  <text class="n1" x="140" y="248">2 · decide — решение модели</text>
  <text class="n2" x="140" y="265">agent/memory.py (ContextManager) + agent/tools.py + llm/*</text>
  <text class="n3" x="140" y="282">контекст собирается под бюджетом, модель возвращает вызов инструмента</text>

  <!-- 3 ACT -->
  <rect class="op" x="120" y="326" width="560" height="74" rx="6"/>
  <rect class="stage" x="120" y="326" width="560" height="74" rx="6"/>
  <text class="n1" x="140" y="352">3 · act — исполнение действия</text>
  <text class="n2" x="140" y="369">browser/actions.py (ActionExecutor)</text>
  <text class="n3" x="140" y="386">id → элемент, скролл, проверка перекрытия, ввод, ожидание «успокоения»</text>

  <!-- 4 VERIFY -->
  <rect class="op" x="120" y="430" width="560" height="74" rx="6"/>
  <rect class="stage-v" x="120" y="430" width="560" height="74" rx="6"/>
  <text class="n1" x="140" y="456">4 · verify — доказательство эффекта</text>
  <text class="n2" x="140" y="473">сравнение состояния до и после</text>
  <text class="n3" x="140" y="490">URL · хеш страницы · значение поля · число диалогов · generation снимка</text>

  <!-- стрелки вниз -->
  <line class="flow2" x1="400" y1="192" x2="400" y2="220" marker-end="url(#a2)"/>
  <line class="flow2" x1="400" y1="296" x2="400" y2="324" marker-end="url(#a2)"/>
  <line class="flow2" x1="400" y1="400" x2="400" y2="428" marker-end="url(#a2)"/>

  <!-- кольцо назад -->
  <path class="flow2" d="M 120 467 L 72 467 L 72 155 L 118 155" marker-end="url(#a2)"/>
  <text class="lbl" x="64" y="330" transform="rotate(-90 64 330)">следующий шаг: дельта, а не страница целиком</text>

  <!-- панели справа -->
  <rect class="panel" x="760" y="118" width="480" height="74" rx="6"/>
  <text class="nh" x="776" y="140">Что видит модель</text>
  <text class="n3" x="776" y="157">Только то, чем можно действовать: название роли, текст, состояние.</text>
  <text class="n3" x="776" y="172">Ни HTML, ни CSS, ни URL-шаблонов — весь снимок влезает в ~500 токенов.</text>
  <line class="lead2" x1="680" y1="155" x2="760" y2="155"/>

  <rect class="panel" x="760" y="222" width="480" height="74" rx="6"/>
  <text class="nh" x="776" y="244">Почему решение свободное</text>
  <text class="n3" x="776" y="261">План на всю задачу не составляется: очередной шаг выбирается по состоянию</text>
  <text class="n3" x="776" y="276">страницы. Другой сайт — другое состояние, тот же цикл.</text>
  <line class="lead2" x1="680" y1="259" x2="760" y2="259"/>

  <rect class="panel-r" x="760" y="326" width="480" height="74" rx="6"/>
  <text class="nhr" x="776" y="348">Ворота безопасности перед действием</text>
  <text class="n3" x="776" y="365">safe / caution → исполняем. destructive (оплата, удаление, отправка, пароль) →</text>
  <text class="n3" x="776" y="380">окно подтверждения человеку; отказ человека = ok=False с причиной.</text>
  <line class="flow2r" x1="680" y1="355" x2="758" y2="355" marker-end="url(#a2r)"/>
  <line class="flow2r" x1="758" y1="372" x2="682" y2="372" marker-end="url(#a2r)"/>

  <rect class="panel" x="760" y="430" width="480" height="74" rx="6"/>
  <text class="nh" x="776" y="452">Честная ошибка вместо гадания</text>
  <text class="n3" x="776" y="469">Перекрыт, disabled, форма отклонила значение, страница не изменилась —</text>
  <text class="n3" x="776" y="484">модель получает конкретную причину и меняет подход, а не повторяет вслепую.</text>
  <line class="lead2" x1="680" y1="467" x2="760" y2="467"/>

  <!-- пример снимка -->
  <rect class="op" x="120" y="540" width="1120" height="120" rx="6" stroke="#1e293b" stroke-width="1"/>
  <text class="nh" x="140" y="566">Так выглядит «карта сайта», которую получает модель (строка из настоящего снимка):</text>
  <text class="mono" x="140" y="594">[17] button  'Add to cart'  (disabled)        [21] link    'Sauce Labs Bike Light'   $9.99</text>
  <text class="mono" x="140" y="614">[22] input   'Search products'  (filled: 'desk')   [23] select 'Sort by'  options: 4</text>
  <text class="n3" x="140" y="638">Плюс алерты, ошибки консоли, позиция скролла и вкладки. Ничего, кроме этого, в контекст не уходит.</text>

  <text class="lbl" x="40" y="684">Фолбэк ввода: если среда не доставила синтетический ввод, действие повторяется внутри страницы и помечается в трейсе (input_method).</text>
</svg>
