name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suite:
    name: offline test-suite (no network, no API keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install webpilot and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the offline suite
        run: python -m pytest -q

      - name: Re-measure page perception (artifact for the docs)
        run: python scripts/measure_perception.py --out measurements-ci.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perception-measurements
          path: measurements-ci.json
          if-no-files-found: ignore

  live-smoke:
    name: live provider smoke tests (optional, needs a key)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" && python -m playwright install --with-deps chromium
      - name: Live smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest -q -m live -rs
